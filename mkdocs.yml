site_name: Shell Mastery Path
site_description: A structured, module-wise Bash/shell scripting training program from entry level to master level.
site_url: https://sigilipelli.github.io/shell-skillmastery/
repo_url: https://github.com/SIGILIPELLI/shell-skillmastery
repo_name: shell-skillmastery

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & First Script": level-1/01-setup.md
      - "02 · Variables & Data Types": level-1/02-variables-data-types.md
      - "03 · Control Flow": level-1/03-control-flow.md
      - "04 · Loops": level-1/04-loops.md
      - "05 · Functions & Arguments": level-1/05-functions-arguments.md
      - "06 · Files & Directories": level-1/06-files-directories.md
      - "07 · Pipes & Redirection": level-1/07-pipes-redirection.md
      - "08 · Basic Text Processing": level-1/08-text-processing.md
      - "09 · Exit Codes & Error Handling": level-1/09-exit-codes-error-handling.md
      - "10 · Project — Backup Script": level-1/10-project-backup-script.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Arrays & Associative Arrays": level-2/01-arrays.md
      - "02 · String Manipulation": level-2/02-string-manipulation.md
      - "03 · Regular Expressions in Bash": level-2/03-regular-expressions.md
      - "04 · Process Management": level-2/04-process-management.md
      - "05 · Scripting Best Practices": level-2/05-best-practices.md
      - "06 · Debugging Scripts": level-2/06-debugging.md
      - "07 · Scheduling & Automation": level-2/07-scheduling-automation.md
      - "08 · Environment & Configuration Management": level-2/08-environment-config.md
